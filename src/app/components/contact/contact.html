<section id="contact" class="section-padding bg-white position-relative">
  <div class="container">
    <div class="row align-items-center g-5">
      <div class="col-lg-6" data-aos="fade-right">
        <h6 class="text-silver fw-bold text-uppercase tracking-wide mb-2">Get In Touch</h6>
        <h2 class="display-5 fw-bold mb-4 text-black">Let's Discuss Your Next Project</h2>
        <p class="text-secondary mb-5 fs-5">
          Ready to turn your vision into reality? Contact us today, and let our team of experts craft the perfect digital solution for your business.
        </p>
        
        <div class="d-flex align-items-center mb-4 p-4 bg-light-gray rounded-4 hover-lift">
          <div class="icon-box bg-white text-dark rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 60px; height: 60px;">
            <i class="bi bi-envelope-fill fs-4"></i>
          </div>
          <div class="ms-4">
            <p class="text-muted mb-1 small fw-bold text-uppercase">Email Us</p>
            <h5 class="mb-0 fw-bold">office@bellarix.in</h5>
          </div>
        </div>
        
        <div class="d-flex align-items-center p-4 bg-light-gray rounded-4 hover-lift">
          <div class="icon-box bg-white text-dark rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 60px; height: 60px;">
            <i class="bi bi-telephone-fill fs-4"></i>
          </div>
          <div class="ms-4">
            <p class="text-muted mb-1 small fw-bold text-uppercase">Call Us</p>
            <h5 class="mb-0 fw-bold">+91 99756 51624</h5>
          </div>
        </div>
      </div>
      
      <div class="col-lg-6" data-aos="fade-left" data-aos-delay="200">
        <div class="card border-0 shadow-lg p-5 rounded-4 bg-white">
          <h3 class="fw-bold mb-4">Send a Message</h3>
          <form (ngSubmit)="sendMessage()">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-medium text-muted small">First Name</label>
                <input type="text" class="form-control form-control-lg bg-light-gray border-0" name="firstName" [(ngModel)]="formData.firstName" placeholder="John" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-medium text-muted small">Last Name</label>
                <input type="text" class="form-control form-control-lg bg-light-gray border-0" name="lastName" [(ngModel)]="formData.lastName" placeholder="Doe">
              </div>
              <div class="col-12">
                <label class="form-label fw-medium text-muted small">Email Address</label>
                <input type="email" class="form-control form-control-lg bg-light-gray border-0" name="email" [(ngModel)]="formData.email" placeholder="john@example.com">
              </div>
              <div class="col-12">
                <label class="form-label fw-medium text-muted small">Your Message</label>
                <textarea class="form-control form-control-lg bg-light-gray border-0" rows="4" name="message" [(ngModel)]="formData.message" placeholder="Tell us about your project..." required></textarea>
              </div>
              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-bx-primary btn-lg w-100">Send via WhatsApp</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
